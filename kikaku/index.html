<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKW　企画・提案一覧</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif; background-color: #f9fafb; color: #1f2937; line-height: 1.8; min-height: 100vh; }
        .site-header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 2rem 3rem; }
        .site-header .back-link { display: inline-block; font-size: 0.78rem; color: #6b7280; text-decoration: none; margin-bottom: 0.75rem; }
        .site-header .back-link:hover { color: #111827; }
        .site-header .badge { display: inline-block; padding: 0.2rem 0.75rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; background: #f5f3ff; color: #6d28d9; letter-spacing: 0.06em; margin-bottom: 0.6rem; margin-left: 0.5rem; }
        .site-header h1 { font-size: 1.8rem; font-weight: 800; color: #111827; letter-spacing: -0.02em; }
        .site-header p { color: #6b7280; font-size: 0.88rem; margin-top: 0.3rem; }
        .container { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem 5rem 2rem; }
        .empty-card { background: #ffffff; border: 1px dashed #d1d5db; border-radius: 0.875rem; padding: 2rem 1.5rem; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.88rem; }
        footer { text-align: center; font-size: 0.72rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.1em; padding: 2rem 0; border-top: 1px solid #e5e7eb; margin-top: 2rem; }
        @media (max-width: 600px) {
            .site-header { padding: 1.5rem 1.25rem; }
            .site-header h1 { font-size: 1.3rem; }
            .container { padding: 1.5rem 1rem 4rem 1rem; }
        }
    </style>
</head>
<body>
<header class="site-header">
    <div>
        <a href="../" class="back-link">← トップへ戻る</a>
        <span class="badge">KIKAKU</span>
    </div>
    <h1>企画・提案　一覧</h1>
    <p>企画書・提案資料の記録です。タイトルをクリックして各資料を開いてください。</p>
</header>

<div class="container">
    <div class="empty-card">資料が追加されるとここに表示されます</div>
</div>

<footer>&copy; 2026 TKW Project Team. All Rights Reserved.</footer>
</body>
</html>
